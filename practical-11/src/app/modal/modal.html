<div class="modal-overlay">

  <div class="modal">

    <div class="modal-header">
      <h2>{{ title }}</h2>
    </div>

    <div class="modal-body">
      <p>{{ body }}</p>
    </div>

    <div class="modal-footer">
      <button type="button" (click)="close()">
        Close
      </button>
    </div>

  </div>

</div>
